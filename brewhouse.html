<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brewhouse Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* CBG Operations Dashboard skin: white app bar, icon rail, black page band, flat 4px tiles and panels, zebra tables */
:root{color-scheme:light;
  --pi-bg:#f4f4f5;--pi-surface:#fff;--pi-ink:#111;--pi-muted:#6b6b72;--pi-line:#e4e4e7;--pi-z1:#fafafa;--pi-z2:#efeff1;--pi-band:#0b0b0c;--pi-band-2:#2a2a2e;--pi-accent:#22c55e;
  --grid:#ececee;--axis:#a1a1aa;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;
  --warn:#b45309;--warn-bg:#fef3c7;--good:#15803d;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--rail:52px}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
  --pi-bg:#0d0d0f;--pi-surface:#17171a;--pi-ink:#ececf0;--pi-muted:#9a9aa3;--pi-line:#2a2a30;--pi-z1:#17171a;--pi-z2:#1e1e22;--pi-band:#000;--pi-band-2:#26262b;
  --grid:#26262b;--axis:#5d5d66;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--warn:#f2b83a;--warn-bg:#3a2a06;--good:#58c98a}}
:root[data-theme="dark"]{color-scheme:dark;
  --pi-bg:#0d0d0f;--pi-surface:#17171a;--pi-ink:#ececf0;--pi-muted:#9a9aa3;--pi-line:#2a2a30;--pi-z1:#17171a;--pi-z2:#1e1e22;--pi-band:#000;--pi-band-2:#26262b;
  --grid:#26262b;--axis:#5d5d66;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--warn:#f2b83a;--warn-bg:#3a2a06;--good:#58c98a}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--pi-bg);color:var(--pi-ink)}
body{margin:0;font-family:var(--sans);font-size:14px;line-height:1.45;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;padding-left:var(--rail);overflow-x:clip}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
[hidden]{display:none!important}
.hdr{position:sticky;top:0;z-index:30;background:var(--pi-surface);border-bottom:1px solid var(--pi-line)}
.nav{height:48px;padding:0 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;text-decoration:none;color:inherit}
.logo{height:26px;width:auto;flex:none}
:root[data-theme="dark"] .logo{background:#fff;border-radius:5px;padding:2px 4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{background:#fff;border-radius:5px;padding:2px 4px}}
.nt{font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.nt b{font-weight:600;color:var(--pi-muted);margin-left:8px;letter-spacing:.06em}
.navb{display:flex;align-items:center;gap:6px}
.thbtn{width:30px;height:30px;border-radius:6px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
.thbtn:hover{background:var(--pi-z2)}.thbtn svg{width:17px;height:17px}.thbtn .i-sun{display:none}
:root[data-theme="dark"] .thbtn .i-sun{display:block}:root[data-theme="dark"] .thbtn .i-moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .thbtn .i-sun{display:block}:root:not([data-theme="light"]) .thbtn .i-moon{display:none}}
.obtn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:6px;border:0;background:transparent;box-shadow:inset 0 0 0 1px var(--pi-line);font:600 12.5px/1 var(--sans);cursor:pointer;text-decoration:none;color:inherit;white-space:nowrap}
.obtn:hover{background:var(--pi-z2)}
.pi-me{width:30px;height:30px;border-radius:50%;background:var(--pi-z2);display:grid;place-items:center;font:600 11px/1 var(--sans)}
#rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:40;display:flex;flex-direction:column;gap:6px;padding:58px 8px 52px;background:var(--pi-surface);border-right:1px solid var(--pi-line)}
#rail a{display:flex;align-items:center;justify-content:center;height:36px;border-radius:6px;color:var(--pi-ink);text-decoration:none}
#rail a svg{width:18px;height:18px}
#rail a:hover{background:var(--pi-z2)}
#rail a[aria-current="page"]{background:var(--pi-accent);color:#fff}
#rail .div{height:1px;background:var(--pi-line);margin:4px 2px}
.hero{background:var(--pi-band);color:#fff;padding:14px 18px 12px}
.eyebrow{margin:0;font:700 15px/1.3 var(--sans)}
.eyebrow a{color:#fff;text-underline-offset:3px}
.eyebrow .sep{margin:0 7px;color:#9a9aa3;font-weight:400}
.pmeta{margin:2px 0 0;font-size:12.5px;color:#c9c9cf}
.fresh{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.fb{display:inline-flex;align-items:center;gap:6px;background:var(--pi-band-2);color:#d9d9de;border-radius:4px;font-size:11px;font-weight:500;padding:3px 7px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.fb i{flex:none;width:7px;height:7px;border-radius:50%;background:#22c55e}.fb.demo i{background:#e0a21b}.fb em{font-style:normal;color:#9a9aa3}
#tabs{display:flex;gap:2px;flex-wrap:wrap;padding:10px 0 0}
#tabs a{color:#c9c9cf;border-radius:4px;padding:6px 10px;font:500 12.5px/1 var(--sans);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
#tabs a:hover{background:var(--pi-band-2);color:#fff}
#tabs a[aria-current="page"]{background:#fff;color:#000;font-weight:600}
#tabs a i{width:8px;height:8px;border-radius:2px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.msb{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 4px 0 12px;border-radius:4px;background:#fff;color:#111;font:600 12.5px/30px var(--sans)}
.msb .msk{color:#6b6b72;font-weight:500}
.msb select{border:0;background:transparent;color:#111;font:600 12.5px/1 var(--sans);height:28px;cursor:pointer}
.bar .note{color:#9a9aa3;font-size:11.5px;flex-basis:100%}
main{padding:14px 18px 60px}
.sec{font:700 12px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--pi-muted);display:flex;align-items:center;gap:14px;margin:14px 0 8px}
.sec::after{content:"";flex:1;height:1px;background:var(--pi-line)}
.trow{display:flex;flex-wrap:wrap;gap:10px}
.trow>.tile{flex:1 1 170px;min-width:0}
.tile,.panel{background:var(--pi-surface);border:1px solid var(--pi-line);border-radius:4px;min-width:0}
.tile{padding:12px 14px}
.tl{font:600 11.5px/1.3 var(--sans);color:var(--pi-muted)}
.tv{font:700 26px/1.15 var(--sans);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.tv small{font-size:13px;font-weight:600;color:var(--pi-muted);margin-left:3px}
.td{font-size:11.5px;color:var(--pi-muted);margin-top:4px}
.td b{font-weight:600;color:var(--pi-ink)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;align-items:start}
.s7{grid-column:span 7}.s5{grid-column:span 5}.s12{grid-column:span 12}
.panel{padding:12px 14px 10px}
.ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ph h2{margin:0;font:700 13.5px/1.3 var(--sans)}
.ph .hint{font-size:11.5px;color:var(--pi-muted)}
.ph .vt{margin-left:auto;display:inline-flex;background:var(--pi-z2);border-radius:5px;padding:2px}
.ph .vt button{border:0;background:transparent;border-radius:4px;padding:4px 8px;font:600 11.5px/1 var(--sans);color:var(--pi-muted);cursor:pointer}
.ph .vt button[aria-pressed="true"]{background:var(--pi-surface);color:var(--pi-ink);box-shadow:0 0 0 1px var(--pi-line)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 2px;font-size:11.5px;color:var(--pi-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px}
.chart{position:relative;margin-top:4px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:500 10.5px var(--sans);fill:var(--pi-muted);font-variant-numeric:tabular-nums}
.chart text.dl{font-weight:600;fill:var(--pi-ink)}
.tip{position:absolute;pointer-events:none;z-index:5;background:var(--pi-surface);color:var(--pi-ink);border:1px solid var(--pi-line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:8px 10px;font-size:12px;min-width:150px;opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.tip .tt{font-weight:700;margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:7px;justify-content:space-between}
.tip .tr span{display:inline-flex;align-items:center;gap:6px;color:var(--pi-muted)}
.tip .tr i{width:8px;height:8px;border-radius:2px}
.tip .tr b{font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font:600 11px/1.2 var(--sans);color:var(--pi-muted);padding:7px 8px;border-bottom:1px solid var(--pi-line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--pi-line);white-space:nowrap}
tbody tr:nth-child(even) td{background:var(--pi-z1)}
th.n,td.n{text-align:right}
.bd{display:inline-flex;align-items:center;gap:6px}
.bd i{width:8px;height:8px;border-radius:2px}
.chk{display:inline-flex;align-items:center;gap:4px;background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600}
.ok{color:var(--good);font-weight:600;font-size:11px}
.link{background:var(--pi-surface);border:1px dashed var(--pi-line);border-radius:4px;padding:12px 14px;font-size:12.5px;color:var(--pi-muted)}
.link b{color:var(--pi-ink)}
.link code{font-size:11.5px;background:var(--pi-z2);padding:1px 5px;border-radius:3px}
@media (max-width:900px){.s7,.s5{grid-column:span 12}}
@media (max-width:640px){:root{--rail:0px}#rail{display:none}.nt b{display:none}main,.hero{padding-left:16px;padding-right:16px}.tv{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>(function(){try{var t=localStorage.getItem('cbg-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>

<script>
"use strict";
const BRANDS = {
  "Carib":     { key: "carib", c: "--s1", yields: { pily: 0.781592, cm: 0.766792, sug: 0.999 } },

};
const STD_PIL = 0.775;
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* tracker column -> short key (live rows from the flow use the tracker's column names) */
const COLS = {"Brand":"b","Brew No":"n","Date":"d","Pilsen Malt (kg)":"pil","Pilsen Malt Yield":"pily","Caramel Malt (kg)":"cm","Chocolate Malt (kg)":"ch","Kettle Caramel 203 – Actual":"cr","Sugar (kg)":"sug","Kettle Up (°P)":"kup","Kettle Up (HLs)":"kuh","Kettle Out (°P)":"ko","Kettle Out (HLs)":"koh","FV Gravity (°P)":"fv","FV Volume (HLs)":"fvh","Mash In Time":"mi","Cast Out Time":"co","Operator Initials":"op","Status":"st"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const num = v => { const x = typeof v === "number" ? v : parseFloat(v); return isFinite(x) ? x : 0; };
const f1 = x => x == null || !isFinite(x) ? "–" : x.toLocaleString("en-GB", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const f2 = x => x == null || !isFinite(x) ? "–" : x.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const f0 = x => x == null || !isFinite(x) ? "–" : Math.round(x).toLocaleString("en-GB");
const hm = m => m == null || !isFinite(m) ? "–" : Math.floor(m / 60) + ":" + String(Math.round(m % 60)).padStart(2, "0");
const avg = a => { const v = a.filter(x => x != null && isFinite(x)); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };

/* same calculations as the Brewhouse sheet */
/* the logs write the same operator several ways (K.Benjamin, K. Benjamin): group them */
const OPS = {};
function opName(v) { const t = String(v || "").trim(); if (!t) return "Not recorded"; const k = t.replace(/[\s.]+/g, "").toUpperCase(); return OPS[k] || (OPS[k] = t.replace(/\.\s*/g, ". ").replace(/\s+/g, " ").trim()); }

function toMin(v) { if (typeof v === "string" && v.trim() !== "" && isFinite(+v)) v = +v; if (typeof v === "number") return v < 2 ? Math.round((v % 1) * 1440) : v; const m = /^(\d{1,2}):(\d{2})/.exec(String(v || "")); return m ? +m[1] * 60 + +m[2] : null; }

  const y = B.yields, pily = num(r.pily) > 0 ? num(r.pily) : y.pily;
  const other = num(r.cm) * y.cm + (y.ch ? num(r.ch) * y.ch : 0) + (y.cr ? num(r.cr) * y.cr : 0) + num(r.sug) * y.sug;
  const th = num(r.pil) * pily + other, ex = num(r.pil) * STD_PIL + other;

  const prev = pm == null ? null : scoped.filter(r => r.m === pm - 1);

  $("#crumb").textContent = bn || "Overview";
  $("#tabs").innerHTML = [["all", "Overview", null]].concat(Object.entries(BRANDS).map(([n, b]) => [b.key, n, b.c]))
    .map(([k, n, c]) => `<a href="#brand=${k}&period=${state.period}" ${k === state.brand ? 'aria-current="page"' : ""}>${c ? `<i style="background:var(${c})"></i>` : ""}${esc(n)}</a>`).join("");
  $("#pmeta").textContent = (bn ? bn + " brewhouse" : "Carib, Stag and Star Malt brewhouse") + " · " + (pm == null ? "Year to date " + year : MON[pm] + " " + year);
  $("#fresh").innerHTML = (META.live
    ? `<span class="fb"><i></i>Live from the Excel trackers <em>${META.at.toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })} · ${f0(ALL.length)} verified brews</em></span>`
    : `<span class="fb demo"><i></i>Snapshot <em>${esc(META.taken || "")} · ${f0(ALL.length)} verified brews</em></span>`)
    + (META.loading ? `<span class="fb demo"><i></i>Getting the latest from SharePoint…</span>` : "")
    + (META.failed ? `<span class="fb demo"><i></i>SharePoint didn't answer; showing the last copy</span>` : "");

  /* KPI tiles */
  const tile = (label, val, unit, cmpNow, cmpPrev, fmt, better) => {
    let d = "";
    if (cmpPrev != null && cmpNow != null && isFinite(cmpPrev)) {
      const diff = cmpNow - cmpPrev, s = diff >= 0 ? "+" : "−";
      d = `<div class="td">vs ${MON[pm - 1]}: <b>${s}${fmt(Math.abs(diff))}</b>${better ? "" : ""}</div>`;
    } else d = `<div class="td">&nbsp;</div>`;
    return `<div class="tile"><div class="tl">${label}</div><div class="tv">${val}${unit ? `<small>${unit}</small>` : ""}</div>${d}</div>`;
  };
  const kpi = rs => ({ n: rs.length, hl: sum(rs.map(r => r.fvh)), eff: avg(rs.map(r => r.eff)), lt: avg(rs.map(r => r.lt)), bt: avg(rs.map(r => r.bt)) });
  const k = kpi(cur), kp = prev && prev.length ? kpi(prev) : null;
  let tiles = tile("Brews", f0(k.n), "", k.n, kp && kp.n, f0)
    + tile("HLs brewed (FV)", f0(k.hl), "hl", k.hl, kp && kp.hl, f0)
    + tile("Extract efficiency", f2(k.eff), "%", k.eff, kp && kp.eff, f2)
    + tile("Total extract loss", f2(k.lt), "%", k.lt, kp && kp.lt, f2)
    + tile("Average brew time", hm(k.bt), "h:mm", k.bt, kp && kp.bt, hm);
  const tgt = bn && BRANDS[bn].ko;
  if (tgt) {
    const inT = cur.filter(r => r.ko >= tgt[0] && r.ko <= tgt[1]).length;
    tiles += `<div class="tile"><div class="tl">Kettle out ${tgt[0]} to ${tgt[1]} °P</div><div class="tv">${cur.length ? Math.round(inT / cur.length * 100) : "–"}<small>%</small></div><div class="td"><b>${inT}</b> of ${cur.length} brews in range</div></div>`;
  }

  /* monthly series for the year */
  const series = (bn ? [bn] : Object.keys(BRANDS)).map(name => ({
    name, c: BRANDS[name].c,
    hl: MON.slice(0, lastM + 1).map((_, m) => sum(yearRows.filter(r => r.brand === name && r.m === m).map(r => r.fvh))),
    eff: MON.slice(0, lastM + 1).map((_, m) => avg(yearRows.filter(r => r.brand === name && r.m === m).map(r => r.eff))),
    n: MON.slice(0, lastM + 1).map((_, m) => yearRows.filter(r => r.brand === name && r.m === m).length),
  }));
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:var(${s.c})"></i>${esc(s.name)}</span>`).join("")}</div>` : "";

  /* operators */
  const ops = {};
  cur.forEach(r => { (ops[r.op] = ops[r.op] || []).push(r); });
  const opRows = Object.entries(ops).map(([op, rs]) => ({ op, n: rs.length, eff: avg(rs.map(r => r.eff)), lt: avg(rs.map(r => r.lt)), bt: avg(rs.map(r => r.bt)) }))
    .sort((a, b) => b.n - a.n);

  /* recent brews */
  const recent = cur.slice().sort((a, b) => b.date - a.date || String(b.n).localeCompare(String(a.n))).slice(0, 15);
  const flag = r => r.eff == null ? "" : r.eff > 102 || r.eff < 92 ? `<span class="chk" title="Efficiency outside 92 to 102 %: check the gravities and volumes on the brew sheet">! Check</span>` : `<span class="ok">✓ OK</span>`;

  $("#app").innerHTML = `
    <div class="sec">${pm == null ? "Year to date" : MON[pm] + " " + year}</div>
    <div class="trow">${tiles}</div>
    <div class="sec">Monthly trend ${year}</div>
    <div class="grid">
      <section class="panel s7"><div class="ph"><h2>HLs brewed (FV volume)</h2><span class="hint">by month${series.length > 1 ? ", stacked by brand" : ""}</span>
        <span class="vt" role="group" aria-label="View"><button type="button" data-v="chart" aria-pressed="true">Chart</button><button type="button" data-v="table" aria-pressed="false">Table</button></span></div>
        ${legend}<div class="chart" id="cHl"></div><div class="tw" id="tHl" hidden></div></section>
      <section class="panel s5"><div class="ph"><h2>Extract efficiency</h2><span class="hint">monthly average, %</span>
        <span class="vt" role="group" aria-label="View"><button type="button" data-v="chart" aria-pressed="true">Chart</button><button type="button" data-v="table" aria-pressed="false">Table</button></span></div>
        ${legend}<div class="chart" id="cEff"></div><div class="tw" id="tEff" hidden></div></section>
    </div>
    <div class="sec">Detail · ${pm == null ? "year to date" : MON[pm] + " " + year}</div>
    <div class="grid">
      <section class="panel s7"><div class="ph"><h2>Latest brews</h2><span class="hint">15 most recent verified</span></div>
        <div class="tw"><table><thead><tr><th>Brew</th>${bn ? "" : "<th>Brand</th>"}<th>Date</th><th class="n">FV HLs</th><th class="n">Kettle out °P</th><th class="n">Extract eff. %</th><th class="n">Total loss %</th><th class="n">Brew time</th><th>Operator</th><th>Check</th></tr></thead>
        <tbody>${recent.map(r => `<tr><td>${esc(r.n)}</td>${bn ? "" : `<td><span class="bd"><i style="background:var(${BRANDS[r.brand].c})"></i>${esc(r.brand)}</span></td>`}<td>${r.date.toLocaleDateString("en-GB", { day: "2-digit", month: "short", timeZone: "UTC" })}</td><td class="n">${f1(r.fvh)}</td><td class="n">${f1(r.ko)}</td><td class="n">${f2(r.eff)}</td><td class="n">${f2(r.lt)}</td><td class="n">${hm(r.bt)}</td><td>${esc(r.op)}</td><td>${flag(r)}</td></tr>`).join("") || `<tr><td colspan="10">No verified brews in this period.</td></tr>`}</tbody></table></div></section>
      <section class="panel s5"><div class="ph"><h2>Operator performance</h2><span class="hint">verified brews in the period</span></div>
        <div class="tw"><table><thead><tr><th>Operator</th><th class="n">Brews</th><th class="n">Extract eff. %</th><th class="n">Total loss %</th><th class="n">Avg brew time</th></tr></thead>
        <tbody>${opRows.map(o => `<tr><td>${esc(o.op)}</td><td class="n">${o.n}</td><td class="n">${f2(o.eff)}</td><td class="n">${f2(o.lt)}</td><td class="n">${hm(o.bt)}</td></tr>`).join("")}</tbody></table></div></section>
    </div>
    <div class="sec">Linking</div>
    <div class="link"><b>Linked to the Excel trackers.</b> This page reads the verified brews from the three brand trackers through the Power Automate flow <b>CBG Brewhouse Dashboard Data</b> each time it opens (about a minute; the last copy shows meanwhile). The calculations here are the same as the Brewhouse sheet. Brews with no FV gravity or volume recorded are left out of the averages here (the tracker counts them as 0 %).</div>`;

  drawBars($("#cHl"), series, lastM, pm);
  drawLines($("#cEff"), series, lastM, pm);
  tableView($("#tHl"), series, lastM, "hl", f1);
  tableView($("#tEff"), series, lastM, "eff", f2);
  document.querySelectorAll(".vt").forEach(g => g.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const panel = g.closest(".panel"), v = b.dataset.v;
    g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    panel.querySelector(".chart").hidden = v !== "chart"; panel.querySelector(".tw").hidden = v !== "table";
    const lg = panel.querySelector(".legend"); if (lg) lg.hidden = v !== "chart";
  }));
}

function tableView(el, series, lastM, key, fmt) {
  el.innerHTML = `<table><thead><tr><th>Month</th>${series.map(s => `<th class="n">${esc(s.name)}</th>`).join("")}${series.length > 1 && key === "hl" ? '<th class="n">Total</th>' : ""}</tr></thead><tbody>` +
    MON.slice(0, lastM + 1).map((m, i) => `<tr><td>${m}</td>${series.map(s => `<td class="n">${fmt(s[key][i])}</td>`).join("")}${series.length > 1 && key === "hl" ? `<td class="n">${fmt(sum(series.map(s => s.hl[i])))}</td>` : ""}</tr>`).join("") + "</tbody></table>";
}

/* ---- charts: thin marks, recessive grid, hover tooltip ---- */
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
function tipEl(host) { let t = host.querySelector(".tip"); if (!t) { t = document.createElement("div"); t.className = "tip"; host.appendChild(t); } return t; }
function showTip(host, x, y, html) {
  const t = tipEl(host); t.innerHTML = html; t.classList.add("on");
  const w = host.clientWidth, tw = t.offsetWidth, th = t.offsetHeight;
  let left = x + 14; if (left + tw > w) left = x - tw - 14; if (left < 0) left = 0;
  t.style.left = left + "px"; t.style.top = Math.max(0, y - th - 10) + "px";
}
function hideTip(host) { const t = host.querySelector(".tip"); if (t) t.classList.remove("on"); }
const W = el => Math.max(300, el.clientWidth || 600);

function drawBars(el, series, lastM, pm) {
  const w = W(el), h = 240, m = { l: 44, r: 8, t: 14, b: 24 }, iw = w - m.l - m.r, ih = h - m.t - m.b, n = lastM + 1;
  const tot = MON.slice(0, n).map((_, i) => sum(series.map(s => s.hl[i])));
  const max = niceMax(Math.max(...tot) * 1.05), bw = Math.min(34, iw / n * 0.62), step = iw / n;
  const y = v => m.t + ih - v / max * ih;
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = max / 4 * k, yy = y(v); g += `<line x1="${m.l}" x2="${w - m.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${yy + 3.5}" text-anchor="end">${f0(v)}</text>`; }
  let bars = "";
  for (let i = 0; i < n; i++) {
    const x = m.l + step * i + (step - bw) / 2; let base = 0;
    series.forEach((s, si) => {
      const v = s.hl[i]; if (!v) return;
      const top = si === series.length - 1 || !series.slice(si + 1).some(t => t.hl[i]);
      const y0 = y(base), y1 = y(base + v), hh = Math.max(0, y0 - y1 - (base ? 2 : 0));
      const r = top ? Math.min(4, bw / 2, hh) : 0;
      const yy = y1;
      bars += top
        ? `<path d="M${x},${yy + hh} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${yy + hh} Z" fill="var(${s.c})" opacity="${pm != null && pm !== i ? .35 : 1}"/>`
        : `<rect x="${x}" y="${yy}" width="${bw}" height="${hh}" fill="var(${s.c})" opacity="${pm != null && pm !== i ? .35 : 1}"/>`;
      base += v;
    });
    g += `<text x="${m.l + step * i + step / 2}" y="${h - 6}" text-anchor="middle">${MON[i]}</text>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="HLs brewed by month">${g}<line x1="${m.l}" x2="${w - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>${bars}<rect id="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  const svg = el.querySelector("svg");
  svg.addEventListener("mousemove", e => {
    const rc = svg.getBoundingClientRect(), sx = (e.clientX - rc.left) * w / rc.width, i = Math.floor((sx - m.l) / step);
    if (i < 0 || i >= n) return hideTip(el);
    showTip(el, (m.l + step * i + step / 2) * rc.width / w, y(tot[i]) * rc.height / h,
      `<div class="tt">${MON[i]}</div>` + series.slice().reverse().map(s => `<div class="tr"><span><i style="background:var(${s.c})"></i>${esc(s.name)}</span><b>${f0(s.hl[i])} hl</b></div>`).join("") +
      (series.length > 1 ? `<div class="tr"><span>Total</span><b>${f0(tot[i])} hl</b></div>` : "") +
      `<div class="tr"><span>Brews</span><b>${sum(series.map(s => s.n[i]))}</b></div>`);
  });
  svg.addEventListener("mouseleave", () => hideTip(el));
}

function drawLines(el, series, lastM, pm) {
  const w = W(el), h = 240, m = { l: 40, r: 14, t: 14, b: 24 }, iw = w - m.l - m.r, ih = h - m.t - m.b, n = lastM + 1;
  const vals = series.flatMap(s => s.eff).filter(v => v != null);
  const sp = Math.max(...vals) - Math.min(...vals) > 6 ? 2 : 1;
  let lo = Math.floor((Math.min(...vals) - .3) / sp) * sp, hi = Math.ceil((Math.max(...vals) + .3) / sp) * sp;
  while ((hi - lo) / sp < 4) { lo -= sp; if ((hi - lo) / sp < 4) hi += sp; }
  const x = i => m.l + (n === 1 ? iw / 2 : iw * i / (n - 1)), y = v => m.t + ih - (v - lo) / (hi - lo) * ih;
  let g = "";
  for (let v = lo; v <= hi + 1e-9; v += sp) { const yy = y(v); g += `<line x1="${m.l}" x2="${w - m.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${yy + 3.5}" text-anchor="end">${f1(v)}</text>`; }
  for (let i = 0; i < n; i++) g += `<text x="${x(i)}" y="${h - 6}" text-anchor="middle">${MON[i]}</text>`;
  let lines = "";
  series.forEach(s => {
    let d = "", pen = false;
    s.eff.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i) + "," + y(v); pen = true; });
    lines += `<path d="${d}" fill="none" stroke="var(${s.c})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = s.eff.map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop();
    if (li != null && li >= 0) lines += `<circle cx="${x(li)}" cy="${y(s.eff[li])}" r="4" fill="var(${s.c})" stroke="var(--pi-surface)" stroke-width="2"/>`;
  });
  if (pm != null) g += `<line x1="${x(pm)}" x2="${x(pm)}" y1="${m.t}" y2="${m.t + ih}" stroke="var(--axis)" stroke-dasharray="3 3"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Extract efficiency by month">${g}${lines}<line id="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--axis)" opacity="0"/><g id="dots"></g></svg>`;
  const svg = el.querySelector("svg"), xh = svg.querySelector("#xh"), dots = svg.querySelector("#dots");
  svg.addEventListener("mousemove", e => {
    const rc = svg.getBoundingClientRect(), sx = (e.clientX - rc.left) * w / rc.width;
    const i = Math.max(0, Math.min(n - 1, Math.round((sx - m.l) / (n === 1 ? 1 : iw / (n - 1)))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("opacity", 1);
    dots.innerHTML = series.filter(s => s.eff[i] != null).map(s => `<circle cx="${x(i)}" cy="${y(s.eff[i])}" r="4.5" fill="var(${s.c})" stroke="var(--pi-surface)" stroke-width="2"/>`).join("");
    const top = Math.min(...series.map(s => s.eff[i] == null ? Infinity : y(s.eff[i])));
    showTip(el, x(i) * rc.width / w, (isFinite(top) ? top : m.t) * rc.height / h,
      `<div class="tt">${MON[i]}</div>` + series.slice().sort((a, b) => (b.eff[i] ?? -1) - (a.eff[i] ?? -1)).map(s => `<div class="tr"><span><i style="background:var(${s.c})"></i>${esc(s.name)}</span><b>${f2(s.eff[i])} %</b></div>`).join(""));
  });
  svg.addEventListener("mouseleave", () => { hideTip(el); xh.setAttribute("opacity", 0); dots.innerHTML = ""; });
}

$("#themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") ? document.documentElement.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const t = dark ? "light" : "dark"; document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("cbg-theme", t); } catch (e) {}
});
$("#period").addEventListener("change", e => { state.period = e.target.value; writeHash(); render(); });
window.addEventListener("hashchange", () => { readHash(); render(); });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 150); });

(async () => {
  readHash();
  useRows(await firstRows());
  render();
  if (CBG_DASH.source === "flow" && CBG_DASH.flowUrl) {
    try { useRows(await liveRows()); META = { live: true, at: new Date() }; }
    catch (e) { META = Object.assign({}, META, { loading: false, failed: true }); }
    render();
  }
})();
</script>
</body>
</html>
